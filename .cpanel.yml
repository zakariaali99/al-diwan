# cPanel Git Version Control deploy hook.
#
# Runs on every `git push` to the cPanel-hosted repository. Replace USERNAME
# with the cPanel account name and adjust the paths if the app lives elsewhere
# (see DEPLOYMENT.md for the full runbook).
#
# NOTE: cPanel runs these as plain shell lines with no shared state between
# them, so each task that needs the virtualenv re-activates it.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/USERNAME/al-diwan.ly
    - export VENV=/home/USERNAME/virtualenv/al-diwan.ly/3.12/bin/activate

    # Sync the working tree, excluding local-only artefacts.
    # frontend/dist is the built React app (committed; the host has no Node).
    # frontend/node_modules and src are deliberately NOT copied.
    - /bin/cp -R backend/config backend/accounts backend/api backend/messaging backend/pages backend/posts backend/services backend/siteconfig backend/templates backend/static backend/locale backend/manage.py backend/requirements.txt $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/frontend
    - /bin/cp -R frontend/dist $DEPLOYPATH/frontend/

    - source $VENV && cd $DEPLOYPATH && pip install --quiet -r requirements.txt
    - source $VENV && cd $DEPLOYPATH && python manage.py migrate --noinput
    - source $VENV && cd $DEPLOYPATH && python manage.py collectstatic --noinput

    # Passenger reloads the app when this file's mtime changes.
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
