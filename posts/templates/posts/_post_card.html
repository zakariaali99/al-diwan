{% load i18n %}
<article class="post-card reveal">
  <div class="post-card-media">
    {% if post.featured_image %}
      <img src="{{ post.featured_image.url }}" alt="" loading="lazy" width="640" height="360">
    {% endif %}
  </div>
  <div class="post-card-body">
    <div class="post-meta">
      {% if post.category %}<span class="tag">{{ post.category }}</span>{% endif %}
      {% if post.published_at %}
        <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"j F Y" }}</time>
      {% endif %}
    </div>
    <h3><a href="{% url 'posts:detail' post.slug %}">{{ post.title }}</a></h3>
    {% if post.excerpt %}<p class="text-muted">{{ post.excerpt|truncatechars:120 }}</p>{% endif %}
  </div>
</article>
