{% extends "base.html" %}
{% load i18n %}

{% block extra_head %}
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14162b; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  .login-card { background: #fff; padding: 2rem 2.25rem; border-radius: 10px; width: 320px; }
  .login-card h1 { font-size: 1.2rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: .8rem 0 .3rem; }
  input { width: 100%; padding: .55rem .7rem; border: 1px solid #d7dae5; border-radius: 6px; font-size: .9rem; box-sizing: border-box; }
  button { margin-top: 1.25rem; width: 100%; padding: .6rem; border-radius: 6px; background: #2454ff; color: #fff; border: none; font-size: .95rem; cursor: pointer; }
  .errorlist { color: #dc2626; font-size: .8rem; list-style: none; padding: 0; }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
  <h1>تسجيل الدخول — لوحة تحكم الديوان</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">اسم المستخدم</label>
    {{ form.username }}
    {{ form.username.errors }}
    <label for="{{ form.password.id_for_label }}">كلمة المرور</label>
    {{ form.password }}
    {{ form.password.errors }}
    <button type="submit">دخول</button>
  </form>
</div>
{% endblock %}
