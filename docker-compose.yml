services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: al_diwan
      MYSQL_USER: al_diwan
      MYSQL_PASSWORD: al_diwan_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: local-dev-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_ENGINE: mysql
      DATABASE_NAME: al_diwan
      DATABASE_USER: al_diwan
      DATABASE_PASSWORD: al_diwan_dev_password
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: info@al-diwan.ly
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
